<div id="list"></div>
<div id="out" hidden><p class="s">複製不了的話，長按下面這段文字全選再複製：</p><textarea id="ta" readonly></textarea></div>

const CATS=["傳產","科技業","建設／土地開發","法律界","醫界","演藝圈","藝品業","食品業","製造業","金融業","美術館","私人藏家（不寫產業）","其他"];

W.forEach(x=>{
  if(x.s!==cur){ cur=x.s; const h=document.createElement("h2"); h.textContent=cur; list.appendChild(h); }

      const inp=document.createElement("input"); inp.type="text"; inp.placeholder="其他：請寫產業別"; inp.value=st.o||(known?"":st.c.replace("藏家","")); inp.hidden=sel.value!=="其他";

document.getElementById("copy").onclick=async()=>{

  W.filter(x=>S[x.k].v==="y").forEach(x=>{ const s=S[x.k]; t+=x.s+"｜"+x.t+"｜"+(s.c==="其他"?(s.o||"其他"):(s.c||"產業別沒選"))+"\n"; });

  const ta=document.getElementById("ta"); ta.value=t; document.getElementById("out").hidden=false;
  let ok=false; try{ await navigator.clipboard.writeText(t); ok=true }catch(e){ try{ ta.select(); ok=document.execCommand("copy") }catch(e2){} }
  document.getElementById("copy").textContent=ok?"已複製，去 LINE 貼上":"請長按下面文字複製"; ta.scrollIntoView({behavior:"smooth"});
};
